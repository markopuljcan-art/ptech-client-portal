<!DOCTYPE html>
<html lang="hr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <link
        rel="stylesheet"
        href="./revision.css?v=10"
    >

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
    </script>

    <script
        src="./revision.js?v=10"
        defer
    ></script>

    <title>
        PTech Digital | Zahtjev za izmjenu
    </title>

</head>


<body>

    <main class="revision-page">


        <!-- =========================
             HEADER
        ========================== -->

        <header class="revision-header">

            <div class="brand">

                <div class="brand-logo">
                    P
                </div>


                <div>

                    <h1>
                        Zahtjev za izmjenu
                    </h1>

                    <p>
                        Razgovor s PTech Digital timom o ovoj verziji dizajna.
                    </p>

                </div>

            </div>


            <a
                href="form.html"
                class="close-button"
                aria-label="Zatvori"
            >
                ×
            </a>

        </header>



        <!-- =========================
             CONTENT
        ========================== -->

        <div class="revision-content">


            <!-- =========================
                 BACK
            ========================== -->

            <div class="revision-back-row">

                <a
                    href="form.html"
                    class="revision-back"
                    id="backToApproval"
                >
                    ‹ Natrag na dizajn
                </a>

            </div>



            <!-- =========================
                 PROJECT INFO
            ========================== -->

            <section class="revision-project-card">

                <div>

                    <span class="revision-label">
                        Projekt
                    </span>


                    <h2 id="revisionProjectTitle">
                        Učitavanje...
                    </h2>


                    <p id="revisionProjectName">
                    </p>

                </div>


                <span
                    class="revision-status"
                    id="revisionProjectStatus"
                >
                    -
                </span>

            </section>



            <!-- =========================
                 NOVA PORUKA
            ========================== -->

            <section class="revision-form-card">

                <div class="revision-form-header">

                    <div>

                        <span class="revision-label">
                            Nova poruka
                        </span>

                        <h2>
                            Što želiš izmijeniti?
                        </h2>

                        <p>
                            Napiši što preciznije što želiš promijeniti na ovoj verziji dizajna.
                        </p>

                    </div>

                </div>


                <form id="revisionForm">


                    <label
                        for="revisionMessage"
                        class="revision-field-label"
                    >
                        Poruka
                    </label>


                    <textarea
                        id="revisionMessage"
                        name="message"
                        rows="7"
                        maxlength="1500"
                        placeholder="Primjer: Promijeniti boju gumba, povećati naslov i pomaknuti sliku malo niže..."
                        required
                    ></textarea>


                    <div class="revision-form-footer">

                        <span id="characterCount">
                            0 / 1500
                        </span>


                        <button
                            type="submit"
                            class="submit-revision-button"
                            id="submitRevisionButton"
                        >
                            Pošalji poruku
                        </button>

                    </div>

                </form>

            </section>



            <!-- =========================
                 SYSTEM MESSAGE
            ========================== -->

            <div
                class="revision-message"
                id="revisionMessageBox"
                hidden
            >
            </div>



            <!-- =========================
                 POVIJEST RAZGOVORA
            ========================== -->

            <section class="conversation-card">

                <div class="conversation-header">

                    <div>

                        <span class="revision-label">
                            Povijest
                        </span>

                        <h3>
                            Razgovor o dizajnu
                        </h3>

                    </div>

                </div>


                <div
                    id="revisionConversation"
                    class="revision-conversation"
                >

                    <div class="conversation-empty">
                        Učitavanje razgovora...
                    </div>

                </div>

            </section>


        </div>

    </main>

</body>

</html>
