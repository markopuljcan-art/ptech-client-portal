<!DOCTYPE html>
<html lang="hr">

<head>

    <meta charset="UTF-8">
    <meta name="theme-color" content="#fcf8f4">
    <script>
      (function(){try{document.documentElement.dataset.adminTheme =
        localStorage.getItem('ptech-admin-theme') === 'dark' ? 'dark' : 'light';}
        catch(e){document.documentElement.dataset.adminTheme = 'light';}})();
    </script>


    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <link
        rel="stylesheet"
        href="./admin-approvals.css?v=1"
    >

    <!-- Admin V3.1: stari CSS + novi dizajn u jednoj datoteci -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>

    <script
        src="./admin-approvals.js?v=1"
        defer
    ></script>

    <title>
        PTech Digital | Odobrenja
    </title>

    defer
></script>
    <!-- Zajednicka administracija i V3 izgled; Dashboard radi samo na admin.html -->

</head>

                <a
                    href="admin-revisions.html"

                    <span class="admin-nav-icon">
                        ↔
                    </span>

                    <span>
                        Zahtjevi
                    </span>

                </a>


                <a
                    href="admin-approvals.html"
                    class="admin-nav-item active"
                >

                    <span class="admin-nav-icon">

                    </span>

                    <span>

                    </span>

                </a>


                <a

<!-- PODRŠKA -->

<a

    </span>

    <span
        id="supportUnreadBadge"
        class="admin-nav-badge"
        hidden
    >
        0

            <div class="admin-sidebar-footer">

                <div class="admin-user">

                    <div class="admin-avatar">
                        A
                    </div>

                    <div>

                        <strong id="adminUserName">
                            Admin
                        </strong>

                        <span>
                            Administrator
                        </span>

                    </div>

                </div>


                <button
                    type="button"
                    id="adminLogoutButton"
                    class="admin-logout"
                >
                    Odjava
                </button>

            </div>

        </aside>


        <!-- =========================
             MAIN
        ========================== -->

        <main class="admin-main">


            <header class="admin-topbar">

                <div>

                    <span class="admin-page-label">
                        Administracija
                    </span>

                    <h2>
                        Odobrenja dizajna
                    </h2>

                </div>


                <div class="admin-topbar-actions">

                    <span class="admin-role-badge">

                    </span>

                </div>

            </header>


            <div class="admin-content">

                <section class="approvals-heading">

                        </span>

                        </h3>
