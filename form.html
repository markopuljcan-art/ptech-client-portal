<!DOCTYPE html>
<html lang="hr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <link
        rel="stylesheet"
        href="style.css?v=6"
    >

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
    </script>

    <script
        src="script.js?v=6"
        defer>
    </script>

    <title>
        PTech Digital Client Portal
    </title>

</head>


<body>

    <main class="dashboard">


        <!-- =========================
             HEADER
        ========================== -->

        <header class="dashboard-header">

            <div class="brand">

                <div class="brand-logo">
                    P
                </div>

                <h1>
                    PTech Digital Client Portal
                </h1>

            </div>


            <div class="header-actions">


                <!-- USER -->

                <div class="user-box">

                    <div class="user-avatar">

                        <svg viewBox="0 0 24 24">

                            <circle
                                cx="12"
                                cy="8"
                                r="3">
                            </circle>

                            <path
                                d="M5 20c0-4 3-7 7-7s7 3 7 7">
                            </path>

                        </svg>

                    </div>

                    <span id="userTop">
                    </span>

                </div>


                <span class="header-separator">
                </span>


                <!-- ODJAVA -->

                <button
                    id="logoutButton"
                    class="logout-button"
                    type="button"
                >

                    <svg viewBox="0 0 24 24">

                        <path
                            d="M10 5H5v14h5">
                        </path>

                        <path
                            d="M14 8l4 4-4 4">
                        </path>

                        <path
                            d="M8 12h10">
                        </path>

                    </svg>

                    <span>
                        Odjava
                    </span>

                </button>


                <span class="header-separator">
                </span>


                <!-- THEME -->

                <label class="theme-switch">

                    <input
                        type="checkbox"
                        id="themeToggle"
                        aria-label="Promijeni temu"
                    >

                    <span class="theme-slider">
                    </span>

                </label>

            </div>

        </header>



        <!-- =========================
             CONTENT
        ========================== -->

        <div class="dashboard-content">


            <!-- WELCOME -->

            <section class="welcome">

                <h2>
                    Bok,
                    <strong id="userGreeting">
                    </strong>!
                </h2>

                <p>
                    Evo što se događa s tvojim projektima.
                </p>

            </section>



            <!-- =========================
                 PROJEKTI
            ========================== -->

            <section class="dashboard-section">

                <div class="section-header">

                    <h2 class="section-title">
                        Aktivni projekti
                    </h2>


                    <div class="project-counter">

                        <span id="currentProject">
                            0
                        </span>

                        <span>
                            /
                        </span>

                        <span id="totalProjects">
                            0
                        </span>

                    </div>

                </div>


                <!--
                    JS automatski generira:
                    - projekt
                    - paket
                    - napredak
                    - rok
                    - status
                    - klikabilni Napredak
                -->

                <div
                    class="projects-slider"
                    id="projectsSlider"
                >
                </div>


                <!-- DOTS -->

                <div
                    class="slider-dots"
                    id="sliderDots"
                >
                </div>

            </section>



            <!-- =========================
                 ZADNJE AKTIVNOSTI
            ========================== -->

            <section
                class="activities-section"
                id="activitiesSection"
                hidden
            >

                <h2 class="section-title">
                    Zadnje aktivnosti
                </h2>


                <div
                    class="activities-card"
                    id="activities"
                >
                </div>

            </section>

        </div>



        <!-- =========================
             FOOTER
        ========================== -->

        <footer class="footer">

            © PTech Digital 2026.
            • Sva prava zadržana.

        </footer>


    </main>

</body>

</html>
