<!DOCTYPE html>
<html lang="hr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style_login.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="login.js" defer></script>

    <title>Prijava | PTech Digital</title>
</head>

<body>

    <!-- THEME SWITCH -->
    <label class="theme-switch">
        <input
            type="checkbox"
            id="themeToggle"
            aria-label="Promijeni temu"
        >
        <span class="theme-slider"></span>
    </label>


    <main class="login-card">

        <!-- LOGO -->
        <div class="login-logo">
            P
        </div>

        <h1>PTech Client Portal</h1>

        <p class="login-subtitle">
            Prijavite se za pristup svom korisničkom računu.
        </p>


        <form id="loginForm">

            <!-- EMAIL -->
            <div class="form-group">

                <label for="email">
                    E-mail adresa
                </label>

                <div class="input-wrapper">

                    <svg
                        class="input-icon"
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >
                        <rect
                            x="3"
                            y="5"
                            width="18"
                            height="14"
                            rx="2"
                        ></rect>

                        <path d="M3 7l9 6 9-6"></path>
                    </svg>

                    <input
                        type="email"
                        id="email"
                        placeholder="ime@tvrtka.hr"
                        autocomplete="email"
                        required
                    >

                </div>

            </div>


            <!-- PASSWORD -->
            <div class="form-group">

                <label for="password">
                    Lozinka
                </label>

                <div class="password-wrapper">

                    <svg
                        class="password-icon"
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >
                        <rect
                            x="5"
                            y="10"
                            width="14"
                            height="10"
                            rx="2"
                        ></rect>

                        <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>
                    </svg>

                    <input
                        type="password"
                        id="password"
                        placeholder="Unesite lozinku"
                        autocomplete="current-password"
                        required
                    >

                    <button
                        type="button"
                        id="togglePassword"
                        class="toggle-password"
                        aria-label="Prikaži lozinku"
                    >

                        <svg
                            class="eye-svg"
                            viewBox="0 0 24 24"
                        >

                            <path
                                d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"
                            ></path>

                            <circle
                                cx="12"
                                cy="12"
                                r="2.5"
                            ></circle>

                            <line
                                class="eye-slash"
                                x1="4"
                                y1="4"
                                x2="20"
                                y2="20"
                            ></line>

                        </svg>

                    </button>

                </div>

            </div>


            <p
                id="capsLockWarning"
                class="caps-lock-warning"
            >
                ⚠ Caps Lock je uključen
            </p>


            <p
                id="loginError"
                class="login-error"
            ></p>


            <button
                type="submit"
                id="loginButton"
            >
                <span>Prijavi se</span>

                <svg
                    class="login-arrow"
                    viewBox="0 0 24 24"
                >
                    <path d="M5 12h14"></path>
                    <path d="m13 6 6 6-6 6"></path>
                </svg>
            </button>

        </form>


        <div class="login-footer">
            © PTech Digital 2026. • Sva prava zadržana.
        </div>

    </main>

</body>
</html>
