<!DOCTYPE html>
<html lang="hr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <link
        rel="stylesheet"
        href="./documents.css?v=5"
    >

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>

    <script
        src="./documents.js?v=4"
        defer
    ></script>

    <title>
        PTech Digital Client Portal
    </title>

</head>


<body>

    <main class="portal-shell">


        <!-- =========================
             TOPBAR
        ========================== -->

        <header class="portal-topbar">


            <!-- BRAND -->

            <a
                href="form.html"
                class="portal-brand"
            >

                <div class="portal-logo">
                    P
                </div>

                <strong>
                    PTech Digital Client Portal
                </strong>

            </a>


            <!-- USER / ACTIONS -->

            <div class="portal-topbar-actions">


                <!-- USER -->

                <div class="portal-user">

                    <div class="portal-user-icon">

                        <svg viewBox="0 0 24 24">

                            <circle
                                cx="12"
                                cy="8"
                                r="3">
                            </circle>

                            <path
                                d="M5 20c0-4 3-7 7-7s7 3 7 7">
                            </path>

                        </svg>

                    </div>

                    <strong id="clientName">
                        Klijent
                    </strong>

                </div>


                <div class="portal-topbar-divider"></div>


                <!-- ODJAVA -->

                <button
                    type="button"
                    id="logoutButton"
                    class="portal-logout"
                >

                    <svg viewBox="0 0 24 24">

                        <path
                            d="M10 5H5v14h5">
                        </path>

                        <path
                            d="M14 8l4 4-4 4">
                        </path>

                        <path
                            d="M8 12h10">
                        </path>

                    </svg>

                    <span>
                        Odjava
                    </span>

                </button>


                <div class="portal-topbar-divider"></div>


                <!-- THEME -->

                <button
                    type="button"
                    id="themeToggle"
                    class="theme-toggle"
                    aria-label="Promijeni temu"
                >
                    Tema
                </button>


            </div>

        </header>


        <!-- =========================
             CONTENT
        ========================== -->

        <div class="portal-content">


            <!-- PAGE HEADER -->

            <section class="documents-page-header">

                <span class="documents-eyebrow">
                    Dokumenti
                </span>

                <h1>
                    Moji dokumenti
                </h1>

                <p>
                    Ovdje možeš pregledati dokumente vezane uz svoje projekte.
                </p>

            </section>


            <!-- =========================
                 FILTERI
            ========================== -->

            <section class="documents-toolbar">


                <div class="documents-search-wrap">

                    <span>
                        ⌕
                    </span>

                    <input
                        type="search"
                        id="documentSearch"
                        placeholder="Pretraži dokument..."
                        autocomplete="off"
                    >

                </div>


                <select id="projectFilter">

                    <option value="">
                        Svi projekti
                    </option>

                </select>


                <select id="typeFilter">

                    <option value="">
                        Sve vrste
                    </option>

                    <option value="Ugovor">
                        Ugovor
                    </option>

                    <option value="Ponuda">
                        Ponuda
                    </option>

                    <option value="Račun">
                        Račun
                    </option>

                    <option value="Brief">
                        Brief
                    </option>

                    <option value="Dizajn">
                        Dizajn
                    </option>

                    <option value="Ostalo">
                        Ostalo
                    </option>

                </select>

            </section>


            <!-- =========================
                 DOKUMENTI
            ========================== -->

            <section class="documents-panel">


                <div class="documents-panel-header">

                    <div>

                        <span>
                            Datoteke
                        </span>

                        <h2>
                            Dokumenti projekata
                        </h2>

                    </div>


                    <div
                        id="documentsCount"
                        class="documents-count"
                    >
                        0
                    </div>

                </div>


                <div
                    id="documentsList"
                    class="documents-list"
                >

                    <div class="documents-empty">
                        Učitavanje dokumenata...
                    </div>

                </div>

            </section>


            <!-- MESSAGE -->

            <div
                id="documentsMessage"
                class="documents-message"
                hidden
            >
            </div>


            <!-- FOOTER -->

            <footer class="portal-footer">

                © PTech Digital 2026.
                • Sva prava zadržana.

            </footer>


        </div>


        <!-- =========================
             BOTTOM NAVIGATION
        ========================== -->

        <nav class="bottom-nav">


            <!-- POČETNA -->

            <a
                href="form.html"
                class="bottom-nav-item"
                aria-label="Početna"
            >

                <svg viewBox="0 0 24 24">

                    <path
                        d="M3 11.5L12 4l9 7.5">
                    </path>

                    <path
                        d="M5 10.5V20h14v-9.5">
                    </path>

                    <path
                        d="M9 20v-6h6v6">
                    </path>

                </svg>

                <span>
                    Početna
                </span>

            </a>


            <!-- PORUKE -->

            <a
                href="messages.html"
                class="bottom-nav-item"
                aria-label="Poruke"
            >

                <div class="bottom-nav-icon-wrap">

                    <svg viewBox="0 0 24 24">

                        <path
                            d="M4 5h16v11H8l-4 4z">
                        </path>

                    </svg>

                    <span
                        class="nav-notification"
                        hidden
                    >
                        0
                    </span>

                </div>

                <span>
                    Poruke
                </span>

            </a>


            <!-- PROJEKTI -->

            <a
                href="projects.html"
                class="bottom-nav-item"
                aria-label="Projekti"
            >

                <svg viewBox="0 0 24 24">

                    <rect
                        x="4"
                        y="5"
                        width="16"
                        height="15"
                        rx="2">
                    </rect>

                    <path
                        d="M8 5V3">
                    </path>

                    <path
                        d="M16 5V3">
                    </path>

                    <path
                        d="M4 9h16">
                    </path>

                </svg>

                <span>
                    Projekti
                </span>

            </a>


            <!-- DOKUMENTI -->

            <a
                href="documents.html"
                class="bottom-nav-item active"
                aria-label="Dokumenti"
            >

                <svg viewBox="0 0 24 24">

                    <path
                        d="M4 4h6l2 2h8v14H4z">
                    </path>

                </svg>

                <span>
                    Dokumenti
                </span>

            </a>


            <!-- PROFIL -->

            <a
                href="profile.html"
                class="bottom-nav-item"
                aria-label="Profil"
            >

                <svg viewBox="0 0 24 24">

                    <circle
                        cx="12"
                        cy="8"
                        r="3">
                    </circle>

                    <path
                        d="M5 20c0-4 3-7 7-7s7 3 7 7">
                    </path>

                </svg>

                <span>
                    Profil
                </span>

            </a>


        </nav>


    </main>

</body>

</html>
