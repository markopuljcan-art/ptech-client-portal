<!DOCTYPE html>
<html lang="hr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <link
        rel="stylesheet"
        href="./documents.css?v=4"
    >

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>

    <script
        src="./documents.js?v=3"
        defer
    ></script>

    <title>
        PTech Digital Client Portal
    </title>

</head>


<body>

    <main class="portal-shell">


        <!-- =========================
             TOPBAR
        ========================== -->

        <header class="portal-topbar">


            <!-- BRAND -->

            <a
                href="form.html"
                class="portal-brand"
            >

                <div class="portal-logo">
                    P
                </div>

                <strong>
                    PTech Digital Client Portal
                </strong>

            </a>


            <!-- USER / ACTIONS -->

            <div class="portal-topbar-actions">


                <div class="portal-user">

                    <div class="portal-user-icon">
                        ♙
                    </div>

                    <strong id="clientName">
                        Klijent
                    </strong>

                </div>


                <div class="portal-topbar-divider"></div>


                <button
                    type="button"
                    id="logoutButton"
                    class="portal-logout"
                >

                    <span>
                        ↪
                    </span>

                    Odjava

                </button>


                <div class="portal-topbar-divider"></div>


                <button
                    type="button"
                    id="themeToggle"
                    class="theme-toggle"
                    aria-label="Promijeni temu"
                >
                    ☀
                </button>


            </div>

        </header>


        <!-- =========================
             CONTENT
        ========================== -->

        <div class="portal-content">


            <!-- PAGE HEADER -->

            <section class="documents-page-header">

                <span class="documents-eyebrow">
                    Dokumenti
                </span>

                <h1>
                    Moji dokumenti
                </h1>

                <p>
                    Ovdje možeš pregledati dokumente vezane uz svoje projekte.
                </p>

            </section>


            <!-- FILTERS -->

            <section class="documents-toolbar">

                <div class="documents-search-wrap">

                    <span>
                        ⌕
                    </span>

                    <input
                        type="search"
                        id="documentSearch"
                        placeholder="Pretraži dokument..."
                        autocomplete="off"
                    >

                </div>


                <select id="projectFilter">

                    <option value="">
                        Svi projekti
                    </option>

                </select>


                <select id="typeFilter">

                    <option value="">
                        Sve vrste
                    </option>

                    <option value="Ugovor">
                        Ugovor
                    </option>

                    <option value="Ponuda">
                        Ponuda
                    </option>

                    <option value="Račun">
                        Račun
                    </option>

                    <option value="Brief">
                        Brief
                    </option>

                    <option value="Dizajn">
                        Dizajn
                    </option>

                    <option value="Ostalo">
                        Ostalo
                    </option>

                </select>

            </section>


            <!-- DOCUMENTS -->

            <section class="documents-panel">


                <div class="documents-panel-header">

                    <div>

                        <span>
                            Datoteke
                        </span>

                        <h2>
                            Dokumenti projekata
                        </h2>

                    </div>


                    <div
                        id="documentsCount"
                        class="documents-count"
                    >
                        0
                    </div>

                </div>


                <div
                    id="documentsList"
                    class="documents-list"
                >

                    <div class="documents-empty">
                        Učitavanje dokumenata...
                    </div>

                </div>


            </section>


            <div
                id="documentsMessage"
                class="documents-message"
                hidden
            >
            </div>


            <!-- FOOTER -->

            <footer class="portal-footer">

                © PTech Digital 2026. • Sva prava zadržana.

            </footer>

        </div>


        <!-- =========================
             BOTTOM NAV
        ========================== -->

        <nav class="bottom-nav">


            <a
                href="form.html"
                class="bottom-nav-item"
            >

                <span class="bottom-nav-icon">
                    ⌂
                </span>

                <span>
                    Početna
                </span>

            </a>


            <a
                href="#"
                class="bottom-nav-item"
            >

                <span class="bottom-nav-icon">
                    ▱
                </span>

                <span>
                    Poruke
                </span>

            </a>


            <a
                href="form.html#projects"
                class="bottom-nav-item"
            >

                <span class="bottom-nav-icon">
                    ▣
                </span>

                <span>
                    Projekti
                </span>

            </a>


            <a
                href="documents.html"
                class="bottom-nav-item active"
            >

                <span class="bottom-nav-icon">
                    □
                </span>

                <span>
                    Dokumenti
                </span>

            </a>


            <a
                href="#"
                class="bottom-nav-item"
            >

                <span class="bottom-nav-icon">
                    ♙
                </span>

                <span>
                    Profil
                </span>

            </a>


        </nav>

    </main>

</body>

</html>
