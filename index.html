<!DOCTYPE html>
<html lang="hr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style_login.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="login.js" defer></script>

    <title>Prijava | PTech Digital</title>
</head>

<body>

    <div class="big_bubble">

        <h1>Prijava</h1>
        <hr>
        <br>
        <h2>Prijavite se u Client Portal</h2>
        <form id="loginForm">

            <!-- E-MAIL -->
            <div class="input-wrapper">

                <svg class="input-icon" viewBox="0 0 24 24">
                    <rect
                        x="3"
                        y="5"
                        width="18"
                        height="14"
                        rx="2"
                    ></rect>

                    <path d="M3 7l9 6 9-6"></path>
                </svg>

                <input
                    type="email"
                    id="email"
                    placeholder="E-mail"
                    required
                >

            </div>


            <!-- LOZINKA -->
            <div class="password-wrapper">
                <!-- LOKOT -->
                <svg class="password-icon" viewBox="0 0 24 24">
                    <rect
                        x="5"
                        y="10"
                        width="14"
                        height="10"
                        rx="2"
                    ></rect>

                    <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>
                </svg>


                <input
                    type="password"
                    id="password"
                    placeholder="Lozinka"
                    required
                >


                <!-- PRIKAŽI / SAKRIJ LOZINKU -->
                <button
                    type="button"
                    id="togglePassword"
                    class="toggle-password"
                    aria-label="Prikaži lozinku"
                >

                    <svg class="eye-svg" viewBox="0 0 24 24">

                        <path
                            d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"
                        ></path>

                        <circle
                            cx="12"
                            cy="12"
                            r="2.5"
                        ></circle>

                        <line
                            class="eye-slash"
                            x1="4"
                            y1="4"
                            x2="20"
                            y2="20"
                        ></line>

                    </svg>

                </button>

            </div>

<p id="loginError" class="login-error"></p>
            <!-- LOGIN + THEME -->
            <div class="login-actions">

                <button
                    type="submit"
                    id="loginButton"
                >
                    Prijavi se
                </button>


                <label class="login-theme-switch">

                    <input
                        type="checkbox"
                        id="themeToggle"
                    >

                    <span class="login-theme-slider"></span>

                </label>

            </div>

        </form>

    </div>

</body>

</html>
