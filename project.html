<!DOCTYPE html>
<html lang="hr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <link
        rel="stylesheet"
        href="./project.css?v=30"
    >

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
    </script>

    <script
        src="./project.js?v=30"
        defer>
    </script>

    <title>
        PTech Digital | Projekt
    </title>

</head>


<body>

    <main class="dashboard">


        <!-- =========================
             HEADER
        ========================== -->

        <header class="dashboard-header">

            <div class="brand">

                <div class="brand-logo">
                    P
                </div>

                <h1>
                    PTech Digital Client Portal
                </h1>

            </div>


            <div class="header-actions">


                <!-- USER -->

                <div class="user-box">

                    <div class="user-avatar">

                        <svg viewBox="0 0 24 24">

                            <circle
                                cx="12"
                                cy="8"
                                r="3">
                            </circle>

                            <path
                                d="M5 20c0-4 3-7 7-7s7 3 7 7">
                            </path>

                        </svg>

                    </div>

                    <span id="userTop"></span>

                </div>


                <span class="header-separator"></span>


                <!-- ODJAVA -->

                <button
                    id="logoutButton"
                    class="logout-button"
                    type="button"
                >

                    <svg viewBox="0 0 24 24">

                        <path d="M10 5H5v14h5"></path>

                        <path d="M14 8l4 4-4 4"></path>

                        <path d="M8 12h10"></path>

                    </svg>

                    <span>
                        Odjava
                    </span>

                </button>


                <span class="header-separator"></span>


                <!-- THEME -->

                <label class="theme-switch">

                    <input
                        type="checkbox"
                        id="themeToggle"
                        aria-label="Promijeni temu"
                    >

                    <span class="theme-slider"></span>

                </label>

            </div>

        </header>



        <!-- =========================
             CONTENT
        ========================== -->

        <div class="dashboard-content">


            <!-- =========================
                 PROJECT DETAIL
                 JS UBACUJE:
                 - Natrag
                 - naziv projekta
                 - status
                 - Paket / Napredak / Rok
                 - Tvoj paket
            ========================== -->

            <div id="projectDetail">

                <div class="empty-state">
                    Učitavanje projekta...
                </div>

            </div>

<!-- =========================
     AKTIVNOSTI
========================= -->

<section class="dashboard-section">

    <div class="activities-detail-card">

        <div class="activities-card-heading">

            <div class="activities-heading-left">

                <div class="activities-main-icon">

                    <svg viewBox="0 0 24 24">

                        <path d="M5 20V12"></path>
                        <path d="M10 20V7"></path>
                        <path d="M15 20V4"></path>
                        <path d="M20 20V10"></path>

                    </svg>

                </div>

                <div>

                    <h3>
                        Aktivnosti
                    </h3>

                    <p>
                        Pregled napretka projekta
                    </p>

                </div>

            </div>

        </div>


        <div
            class="activities-card"
            id="projectActivities"
        >

            <div class="empty-state">
                Učitavanje aktivnosti...
            </div>

        </div>

    </div>

</section>


<!-- =========================
     ROK PROJEKTA
========================= -->

<section class="dashboard-section">

    <div id="projectDeadlineDetails">

        <div class="empty-state">
            Učitavanje detalja roka...
        </div>

    </div>

</section>


            <!-- =========================
                 DETALJI ROKA
            ========================== -->

            <section class="dashboard-section">

                <div id="projectDeadlineDetails">

                    <div class="empty-state">
                        Učitavanje detalja roka...
                    </div>

                </div>

            </section>



            <!-- =========================
                 DOKUMENTI
            ========================== -->

            <section class="dashboard-section">

                <div class="section-header">

                    <h2 class="section-title">
                        Dokumenti
                    </h2>

                </div>


                <div
                    class="project-documents"
                    id="projectDocuments"
                >

                    <div class="empty-state">
                        Učitavanje dokumenata...
                    </div>

                </div>

            </section>


        </div>



        <!-- =========================

        ========================== -->

        <footer class="footer">

            © PTech Digital 2026.

        </footer>

        ========================== -->

        <nav class="bottom-nav">


            <!-- POČETNA -->

            <a

                class="bottom-nav-item"

                <svg viewBox="0 0 24 24">

                    <path d="M3 11.5L12 4l9 7.5"></path>

                    <path d="M5 10.5V20h14v-9.5"></path>

                    <path d="M9 20v-6h6v6"></path>

                </svg>

                <span>
                    Početna
                </span>

            </a>



            <!-- PORUKE -->

            <a

                    <path

                    </path>

                </svg>

                <span>
                    Poruke
                </span>

            </a>



            <!-- PROJEKTI -->

            <a

            >

                <svg viewBox="0 0 24 24">

                    <rect

                        y="5"

                    <path d="M8 5V3"></path>

                    <path d="M4 9h16"></path>

                </svg>

                <span>
                    Projekti
                </span>

            </a>



            <!-- DOKUMENTI -->

            <a
                href="documents.html"
                class="bottom-nav-item"
            >

                <svg viewBox="0 0 24 24">

                    <path
                        d="M4 4h6l2 2h8v14H4z">
                    </path>

                </svg>

                <span>
                    Dokumenti
                </span>

            </a>



            <!-- PROFIL -->

            <a
                href="profile.html"
                class="bottom-nav-item"
            >

                <svg viewBox="0 0 24 24">

                    <circle
                        cx="12"
                        cy="8"
                        r="3">
                    </circle>

                    <path
                        d="M5 20c0-4 3-7 7-7s7 3 7 7">
                    </path>

                </svg>
