<!DOCTYPE html>
<html lang="hr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <link
        rel="stylesheet"
        href="./project.css?v=51"
    >

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>

    <script
        src="./project.js?v=51"
        defer
    ></script>

    <title>
        PTech Digital | Projekt
    </title>

</head>


<body>

    <main class="dashboard">


        <!-- =========================
             HEADER
        ========================== -->

        <header class="dashboard-header">


            <!-- BRAND -->

            <a
                href="form.html"
                class="brand"
            >

                <div class="brand-logo">
                    P
                </div>

                <h1>
                    PTech Digital Client Portal
                </h1>

            </a>


            <!-- HEADER ACTIONS -->

            <div class="header-actions">


                <!-- USER -->

                <div class="user-box">

                    <div class="user-avatar">

                        <svg viewBox="0 0 24 24">

                            <circle
                                cx="12"
                                cy="8"
                                r="3"
                            ></circle>

                            <path
                                d="M5 20c0-4 3-7 7-7s7 3 7 7"
                            ></path>

                        </svg>

                    </div>

                    <strong id="userTop">
                        Klijent
                    </strong>

                </div>


                <span class="header-separator"></span>


                <!-- LOGOUT -->

                <button
                    id="logoutButton"
                    class="logout-button"
                    type="button"
                >

                    <svg viewBox="0 0 24 24">

                        <path
                            d="M10 5H5v14h5"
                        ></path>

                        <path
                            d="M14 8l4 4-4 4"
                        ></path>

                        <path
                            d="M8 12h10"
                        ></path>

                    </svg>

                    <span>
                        Odjava
                    </span>

                </button>


                <span class="header-separator"></span>


                <!-- THEME -->

                <label class="theme-switch">

                    <input
                        type="checkbox"
                        id="themeToggle"
                        aria-label="Promijeni temu"
                    >

                    <span class="theme-slider"></span>

                </label>


            </div>

        </header>


        <!-- =========================
             CONTENT
        ========================== -->

        <div class="dashboard-content">


            <!-- PROJECT DETAIL -->

            <div id="projectDetail">

                <div class="empty-state">
                    Učitavanje projekta...
                </div>

            </div>


            <!-- =========================
                 ACTIVITIES
            ========================== -->

            <section class="dashboard-section">

                <div class="activities-detail-card">


                    <div class="activities-card-heading">

                        <div class="activities-heading-left">


                            <div class="activities-main-icon">

                                <svg viewBox="0 0 24 24">

                                    <path
                                        d="M5 20V12"
                                    ></path>

                                    <path
                                        d="M10 20V7"
                                    ></path>

                                    <path
                                        d="M15 20V4"
                                    ></path>

                                    <path
                                        d="M20 20V10"
                                    ></path>

                                </svg>

                            </div>


                            <div>

                                <h3>
                                    Aktivnosti
                                </h3>

                                <p>
                                    Pregled napretka projekta
                                </p>

                            </div>


                        </div>

                    </div>


                    <div
                        class="activities-card"
                        id="projectActivities"
                    >

                        <div class="empty-state">
                            Učitavanje aktivnosti...
                        </div>

                    </div>


                </div>

            </section>


            <!-- =========================
                 DEADLINE
            ========================== -->

            <section class="dashboard-section">

                <div id="projectDeadlineDetails">

                    <div class="empty-state">
                        Učitavanje roka...
                    </div>

                </div>

            </section>


            <!-- FOOTER -->

            <footer class="footer">

                © PTech Digital 2026.
                • Sva prava zadržana.

            </footer>


        </div>


        <!-- =========================
             BOTTOM NAV
        ========================== -->

        <nav class="bottom-nav">


            <!-- HOME -->

            <a
                href="form.html"
                class="bottom-nav-item"
            >

                <svg viewBox="0 0 24 24">

                    <path
                        d="M3 11.5L12 4l9 7.5"
                    ></path>

                    <path
                        d="M5 10.5V20h14v-9.5"
                    ></path>

                    <path
                        d="M9 20v-6h6v6"
                    ></path>

                </svg>

                <span>
                    Početna
                </span>

            </a>


            <!-- MESSAGES -->

            <a
                href="messages.html"
                class="bottom-nav-item"
            >

                <div class="bottom-nav-icon-wrap">

                    <svg viewBox="0 0 24 24">

                        <path
                            d="M4 5h16v11H8l-4 4z"
                        ></path>

                    </svg>


                    <span
                        id="messagesUnreadBadge"
                        class="nav-notification"
                        hidden
                    >
                        0
                    </span>

                </div>

                <span>
                    Poruke
                </span>

            </a>


            <!-- PROJECTS -->

            <a
                href="my-projects.html"
                class="bottom-nav-item active"
            >

                <svg viewBox="0 0 24 24">

                    <rect
                        x="4"
                        y="5"
                        width="16"
                        height="15"
                        rx="2"
                    ></rect>

                    <path
                        d="M8 5V3"
                    ></path>

                    <path
                        d="M16 5V3"
                    ></path>

                    <path
                        d="M4 9h16"
                    ></path>

                </svg>

                <span>
                    Projekti
                </span>

            </a>


            <!-- DOCUMENTS -->

            <a
                href="documents.html"
                class="bottom-nav-item"
            >

                <svg viewBox="0 0 24 24">

                    <path
                        d="M4 4h6l2 2h8v14H4z"
                    ></path>

                </svg>

                <span>
                    Dokumenti
                </span>

            </a>


            <!-- PROFILE -->

            <a
                href="profile.html"
                class="bottom-nav-item"
            >

                <svg viewBox="0 0 24 24">

                    <circle
                        cx="12"
                        cy="8"
                        r="3"
                    ></circle>

                    <path
                        d="M5 20c0-4 3-7 7-7s7 3 7 7"
                    ></path>

                </svg>

                <span>
                    Profil
                </span>

            </a>


        </nav>


    </main>

</body>

</html>
