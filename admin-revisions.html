<!DOCTYPE html>
<html lang="hr">

<head>

    <meta charset="UTF-8">
    <meta name="theme-color" content="#fcf8f4">
    <script>
      (function(){try{document.documentElement.dataset.adminTheme =
        localStorage.getItem('ptech-admin-theme') === 'dark' ? 'dark' : 'light';}
        catch(e){document.documentElement.dataset.adminTheme = 'light';}})();
    </script>


    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <link
        rel="stylesheet"
        href="./admin-revisions.css?v=3"
    >

    <!-- Admin V3.1: stari CSS + novi dizajn u jednoj datoteci -->
    <link rel="stylesheet" href="./admin.css?v=32">


    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>

    <script
        src="./admin-revisions.js?v=6"
        defer
    ></script>

    <title>
        PTech Digital | Zahtjevi
    </title>
    <script
    src="./admin-notifications.js?v=1"
    defer
></script>
    <!-- Zajednicka administracija i V3 izgled; Dashboard radi samo na admin.html -->
    <script defer src="./admin.js?v=32"></script>
</head>


<body data-admin-page="admin-revisions.html">

    <div class="admin-shell">


        <!-- SIDEBAR -->

        <aside class="admin-sidebar">

            <div class="admin-brand">

                <div class="admin-brand-logo">
                    P
                </div>

                <div>

                    <h1>
                        PTech Digital
                    </h1>

                    <span>
                        Admin Panel
                    </span>

                </div>

            </div>


            <nav class="admin-nav">

                <a
                    href="admin.html"
                    class="admin-nav-item"
                >

                    <span class="admin-nav-icon">
                        ◫
                    </span>

                    <span>
                        Dashboard
                    </span>

                </a>


                <a
                    href="admin-projects.html"
                    class="admin-nav-item"
                >

                    <span class="admin-nav-icon">
                        ▣
                    </span>

                    <span>
                        Projekti
                    </span>

                </a>
                <a href="admin-clients.html" class="admin-nav-item">
                    <span class="admin-nav-icon">♧</span>
                    <span>Klijenti</span>
                </a>


                <a
                    href="admin-revisions.html"
                    class="admin-nav-item active"
                >

                    <span class="admin-nav-icon">
                        ↔
                    </span>

                    <span>
                        Zahtjevi
                    </span>

                </a>


                <a
                    href="admin-approvals.html"
                    class="admin-nav-item"
                >

                    <span class="admin-nav-icon">
                        ✓
                    </span>

                    <span>
                        Odobrenja
                    </span>

                </a>


                <a
                    href="admin-documents.html"
                    class="admin-nav-item"
                >

                    <span class="admin-nav-icon">
                        □
                    </span>

                    <span>
                        Dokumenti
                    </span>

                </a>

                <a
                    href="admin-support.html"
                    class="admin-nav-item"
                >
                
                    <span class="admin-nav-icon">
                        ◌
                    </span>
                
                    <span>
                        Podrška
                    </span>
                
                    <span
                        id="supportUnreadBadge"
                        class="admin-nav-badge"
                        hidden
                    >
                        0
                    </span>
                
                </a>
            </nav>


            <div class="admin-sidebar-footer">

                <div class="admin-user">

                    <div class="admin-avatar">
                        A
                    </div>

                    <div>

                        <strong id="adminUserName">
                            Admin
                        </strong>

                        <span>
                            Administrator
                        </span>

                    </div>

                </div>


                <button
                    type="button"
                    id="adminLogoutButton"
                    class="admin-logout"
                >
                    Odjava
                </button>

            </div>

        </aside>



        <!-- MAIN -->

        <main class="admin-main">


            <!-- TOPBAR -->

            <header class="admin-topbar">

                <div>

                    <span class="admin-page-label">
                        Administracija
                    </span>

                    <h2>
                        Zahtjevi za izmjenu
                    </h2>

                </div>


                <div class="admin-topbar-actions">

                    <span class="admin-role-badge">
                        Admin
                    </span>

                </div>

            </header>



            <!-- CONTENT -->

            <div class="admin-content">


                <section class="admin-revisions-heading">

                    <div>

                        <span class="admin-page-label">
                            Klijenti
                        </span>

                        <h3>
                            Pristigli zahtjevi
                        </h3>

                        <p>
                            Pregledaj zahtjeve klijenata i pošalji odgovor.
                        </p>

                    </div>


                    <span
                        id="revisionCount"
                        class="revision-count"
                    >
                        0
                    </span>

                </section>



                <div
                    id="adminRevisionsList"
                    class="admin-revisions-list"
                >

                    <div class="admin-empty">
                        Učitavanje zahtjeva...
                    </div>

                </div>



                <div
                    id="adminMessage"
                    class="admin-message"
                    hidden
                >
                </div>


            </div>

        </main>

    </div>

</body>

</html>
